<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script type="module"
src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
</script>

<style>
body{
    margin:0;
}

model-viewer{
    width:100vw;
    height:100vh;
}

#ar-button{
    position:absolute;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    padding:15px 25px;
    font-size:18px;
    z-index:999;
}
</style>
</head>

<body>

<model-viewer
id="visor"
src="Modelos/sector_llenado_ar.glb"
camera-controls
auto-rotate
ar
ar-modes="scene-viewer webxr"
style="width:100vw;height:100vh;">
</model-viewer>

<button id="ar-button">
📱 Ver en AR
</button>

<script>
document.getElementById('ar-button').addEventListener('click', async () => {
    const visor = document.getElementById('visor');

    try {
        await visor.activateAR();
    } catch(err) {
        alert("Error AR: " + err);
        console.error(err);
    }
});
</script>

</body>
</html>
